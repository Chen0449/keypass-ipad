name: build-unsigned-ipa

on:
  # 只留手动 / API 触发：之前是每文件一次 commit，一个 push 触发 18 次构建，全卡在队列里
  workflow_dispatch:

jobs:
  build:
    # macos-15 排队太久（实测 8 分钟没分到机器），改用 macos-14 + 下面把工程格式降级
    # 想省掉降级那步就把这里换回 macos-15（它自带 Xcode 16，认 objectVersion 77）
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          sw_vers
          ls -d /Applications/Xcode*.app || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee generate.log
          # 新版 xcodegen 写 objectVersion 77（Xcode 16 格式），Xcode 15.4 读不了 → 降到 56
          PBX=KeyPass.xcodeproj/project.pbxproj
          if grep -q 'objectVersion = 77' "$PBX"; then
            sed -i '' 's/objectVersion = 77;/objectVersion = 56;/' "$PBX"
            echo "objectVersion 77 -> 56" | tee -a generate.log
          fi
          echo "--- 生成的 scheme ---" 2>&1 | tee -a generate.log
          xcodebuild -list -project KeyPass.xcodeproj 2>&1 | tee -a generate.log

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project KeyPass.xcodeproj \
            -scheme KeyPassHost \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            generate.log
          if-no-files-found: warn

      - name: Package Payload
        if: success()
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/KeyPassHost.app"
          test -d "$APP_PATH" || { echo "找不到 $APP_PATH"; ls -R build/Build/Products || true; exit 1; }
          test -d "$APP_PATH/PlugIns/KeyPassKeyboard.appex" || { echo "扩展没进 PlugIns"; ls -R "$APP_PATH" || true; exit 1; }
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP_PATH" out/Payload/
          cd out
          zip -qry KeyPass-unsigned.ipa Payload
          ls -lh KeyPass-unsigned.ipa

      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KeyPass-unsigned-ipa
          path: out/KeyPass-unsigned.ipa
          if-no-files-found: error
